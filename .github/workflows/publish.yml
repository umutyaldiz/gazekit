name: Publish to npm

# Her GitHub Release yayınlandığında (Release published) çalışır.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) + provenance için gerekli

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted Publishing, Node >= 22.14.0 gerektirir.
      # DIKKAT: registry-url VERILMEMELI. Verilirse setup-node .npmrc'ye
      # "_authToken=${NODE_AUTH_TOKEN}" yazar; token olmadigi icin bu bos
      # string'e doner, npm "auth var" sanip OIDC degisimini hic baslatmaz
      # ve publish 404 ile duser. Bkz. actions/setup-node#1551
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 npm 10.x ile geliyor; OIDC için npm >= 11.5.1 şart.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Release etiketi ile package.json sürümü uyuşmalı.
      # Kabul edilen biçimler: "v0.1.0", "0.1.0", "gazekit@0.1.0"
      - name: Verify version matches tag
        run: |
          RAW="$GITHUB_REF_NAME"
          TAG="${RAW##*@}"   # "gazekit@0.1.0" -> "0.1.0"
          TAG="${TAG#v}"     # "v0.1.0"        -> "0.1.0"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$RAW normalized=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release etiketi ($RAW -> $TAG) ile package.json sürümü ($PKG) uyuşmuyor."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Kimlik doğrulama OIDC ile yapılır: NODE_AUTH_TOKEN / NPM_TOKEN yok.
      # Provenance, trusted publishing'de otomatik üretilir.
      - name: Publish
        run: npm publish --access public
