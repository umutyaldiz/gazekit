name: Publish to npm

# Her GitHub Release yayınlandığında (Release published) çalışır.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) + provenance için gerekli

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted Publishing, Node >= 22.14.0 gerektirir.
      # DIKKAT: registry-url VERILMEMELI. Verilirse setup-node .npmrc'ye
      # "_authToken=${NODE_AUTH_TOKEN}" yazar; token olmadigi icin bu bos
      # string'e doner, npm "auth var" sanip OIDC degisimini hic baslatmaz
      # ve publish 404 ile duser. Bkz. actions/setup-node#1551
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 npm 10.x ile geliyor; OIDC için npm >= 11.5.1 şart.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Release etiketi ile package.json sürümü uyuşmalı.
      # Kabul edilen biçimler: "v0.1.0", "0.1.0", "gazekit@0.1.0"
      - name: Verify version matches tag
        run: |
          RAW="$GITHUB_REF_NAME"
          TAG="${RAW##*@}"   # "gazekit@0.1.0" -> "0.1.0"
          TAG="${TAG#v}"     # "v0.1.0"        -> "0.1.0"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$RAW normalized=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release etiketi ($RAW -> $TAG) ile package.json sürümü ($PKG) uyuşmuyor."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # OIDC neden calismadigini kesinlestirmek icin. Sir basmaz; yalnizca
      # degiskenlerin VAR/YOK oldugunu ve npm surumunu gosterir.
      - name: OIDC teshis
        run: |
          echo "npm            : $(npm --version)   (>= 11.5.1 olmali)"
          echo "node           : $(node --version)  (>= 22.14.0 olmali)"
          echo "id-token URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+VAR}${ACTIONS_ID_TOKEN_REQUEST_URL:-YOK}"
          echo "id-token TOKEN : ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+VAR}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-YOK}"
          echo "repo           : $GITHUB_REPOSITORY"
          echo "workflow file  : $(basename "$GITHUB_WORKFLOW_REF" | cut -d@ -f1)"
          echo "registry       : $(npm config get registry)"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npmrc yolu     : $npmrc"
          if [ -f "$npmrc" ]; then
            echo "--- npmrc (deger maskeli) ---"
            sed -E 's/(=).*/***/' "$npmrc"
          else
            echo "npmrc dosyasi yok (OIDC icin dogru durum)"
          fi

      # Savunma amacli: herhangi bir adim .npmrc'ye authToken yazdiysa temizle.
      # Bos bir _authToken satiri bile npm'in OIDC degisimini atlamasina yeter.
      - name: npmrc temizle
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc" || true
          echo "temizlendi"

      # Kimlik doğrulama OIDC ile yapılır: NODE_AUTH_TOKEN / NPM_TOKEN yok.
      # Provenance, trusted publishing'de otomatik üretilir.
      - name: Publish
        run: npm publish --access public
